
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do Lists</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f2f2;
        }

        
        .ToDo {
            width: 80%;
            max-width: 600px;
            background-color: white;
            border: 2px solid #333;
            border-radius: 15px;
            overflow: hidden;
        }

        
        header {
            width: 100%;
            padding: 20px;
            background-color: #333;
            color: white;
            text-align: center;
        }

        
        .todo-content {
            padding: 25px;
            text-align: center;
        }

        .todo-content h2 {
            margin-bottom: 25px;
        }

        
        .todo-item {
            list-style: none;
        }

        .todo-item li {
            border: 2px solid #777;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 20px;
        }

        
        .button-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .edit-btn {
            width: 45px;
            height: 45px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 25px;
            cursor: pointer;
        }

        .edit-btn:hover {
            background-color: #555;
        }

    </style>
</head>

<body>

    <main class="ToDo">

        <header>
            <h1>To Do Lists</h1>
        </header>

        <div class="todo-content">

            <h2>All Todo Lists</h2>

            <ul class="todo-item">
                <li>Study CSS</li>
                <li>Study HTML</li>
                <li>Study JavaScript</li>
            </ul>

            <div class="button-container">
                <button class="edit-btn">+</button>
            </div>

        </div>

    </main>

</body>
</html>
