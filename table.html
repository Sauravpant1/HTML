<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table   </title>
    <style>
        th , td {
            padding: 10px;
            border: 1px solid;
        }
    </style>
</head>
<body>
    <table border="1" style="border-collapse: collapse;">
        <tr>
            <th colspan="2">Student Details</th>
            <th colspan="3">Subject Marks(out of 100)</th>
            <th rowspan="2">Total <br> out of 300</th>
        </tr>
        <tr>
            <th>Roll no.</th>
            <th>Name</th>
            <th>HTML</th>
            <th>CSS</th>
            <th>JavaScript</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Asha</td>
            <td>88</td>
            <td>84</td>
            <td>90</td>
            <td>262</td>
        </tr>
    </table>
</body>
</html>
